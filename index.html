<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hell Week Tracker & RPG Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [week, setWeek] = React.useState(1);
            const [xp, setXp] = React.useState(120);
            const [level, setLevel] = React.useState(2);
            const [completedTasks, setCompletedTasks] = React.useState({});
            
            // Progresii pe săptămâni pentru obiective
            const weekGoals = {
                1: { pullups: 7, pushups: 20, handstand: "5s liber", weight: 79.5 },
                2: { pullups: 9, pushups: 24, handstand: "12s liber", weight: 79.0 },
                3: { pullups: 10, pushups: 27, handstand: "20s liber", weight: 78.5 },
                4: { pullups: 12, pushups: 30, handstand: "30s liber", weight: 78.0 }
            };

            const toggleTask = (taskId) => {
                setCompletedTasks(prev => {
                    const newState = { ...prev, [taskId]: !prev[taskId] };
                    if (!prev[taskId]) {
                        setXp(x => {
                            const newXp = x + 25;
                            if (newXp >= level * 100) {
                                setLevel(l => l + 1);
                                alert("🎉 LEVEL UP! Ai avansat în rang!");
                            }
                            return newXp;
                        });
                    }
                    return newState;
                });
            };

            return (
                <div className="max-w-md mx-auto p-4 pb-20">
                    <header className="mb-6 text-center border-b border-red-900/50 pb-4">
                        <h1 className="text-2xl font-black text-red-500 tracking-wider">🔥 LUNA IADULUI</h1>
                        <p className="text-xs text-slate-400 mt-1">Sistem de Control 24/7 & Performanță</p>
                        
                        {/* Selector Săptămână */}
                        <div className="flex justify-center gap-2 mt-4">
                            {[1, 2, 3, 4].map(w => (
                                <button 
                                    key={w}
                                    onClick={() => setWeek(w)}
                                    className={`px-3 py-1 rounded text-xs font-bold transition ${week === w ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                                >
                                    Săpt. {w}
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* Status RPG */}
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 shadow-lg">
                        <div className="flex justify-between items-center mb-2">
                            <span className="text-sm font-bold text-red-400">NIVEL {level} (Recrut Tactic)</span>
                            <span className="text-xs text-slate-400">{xp} / {level * 100} XP</span>
                        </div>
                        <div className="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                            <div className="bg-red-500 h-full transition-all duration-300" style={{ width: `${Math.min(100, (xp / (level * 100)) * 100)}%` }}></div>
                        </div>
                        <div className="mt-3 grid grid-cols-3 gap-2 text-center text-xs">
                            <div className="bg-slate-800/60 p-2 rounded">
                                <span className="block text-slate-400">Tracțiuni</span>
                                <span className="font-bold text-red-400">{weekGoals[week].pullups} reps</span>
                            </div>
                            <div className="bg-slate-800/60 p-2 rounded">
                                <span className="block text-slate-400">Flotări</span>
                                <span className="font-bold text-red-400">{weekGoals[week].pushups} reps</span>
                            </div>
                            <div className="bg-slate-800/60 p-2 rounded">
                                <span className="block text-slate-400">Handstand</span>
                                <span className="font-bold text-red-400">{weekGoals[week].handstand}</span>
                            </div>
                        </div>
                    </div>

                    {/* Blocuri Zilei de Luni */}
                    <h2 className="text-lg font-bold text-slate-200 mb-3">📅 Luni — Săptămâna {week}</h2>
                    <div className="space-y-3">
                        {[
                            { id: 'm1', time: '05:00 - 06:00', title: 'Calisthenics Dinamic & Handstand', desc: `Încălzire 8m | Kick-ups 4x5 (pauză 45s) | Tracțiuni ${weekGoals[week].pullups}x4 (pauză 90s) | Flotări ${weekGoals[week].pushups}x3 (pauză 60s)` },
                            { id: 'm2', time: '08:00 - 14:20', title: 'CEITI - Grupa R-2611', desc: 'Ore de curs + Pauza mare (15 min serii light pe stadion)' },
                            { id: 'm3', time: '16:30 - 18:00', title: 'Lupte Libere & Shadowboxing', desc: 'Încălzire 20m | Intrări la picioare 40m | Shadowboxing & footwork 25m' },
                            { id: 'm4', time: '18:30 - 19:00', title: 'Instagram Reel', desc: 'Editare și publicare cu hanorac negru și bandană' },
                            { id: 'm5', time: '19:00 - 21:00', title: 'Python / YouTube / Kwork', desc: '2 ore de focalizare maximă pe cod și monetizare' },
                        ].map(task => (
                            <div 
                                key={task.id}
                                onClick={() => toggleTask(task.id)}
                                className={`p-4 rounded-xl border transition cursor-pointer ${completedTasks[task.id] ? 'bg-emerald-950/30 border-emerald-600/50 text-emerald-200' : 'bg-slate-900 border-slate-800'}`}
                            >
                                <div className="flex justify-between items-start">
                                    <span className="text-xs font-mono text-red-400 font-bold">{task.time}</span>
                                    <span className={`text-xs px-2 py-0.5 rounded font-bold ${completedTasks[task.id] ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                        {completedTasks[task.id] ? '✓ Făcut' : 'De făcut'}
                                    </span>
                                </div>
                                <h3 className="font-bold text-sm mt-1">{task.title}</h3>
                                <p className="text-xs text-slate-400 mt-1">{task.desc}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
