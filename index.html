            if (!soundEnabled) return;
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);

              if (type === 'check') {
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
              } else if (type === 'uncheck') {
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
              } else if (type === 'level') {
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
              }
            } catch (e) {}
          };

            let xp = 0;
            Object.keys(completedTasks).forEach(key => {
              if (completedTasks[key]) {
                const [w, day, taskId] = key.split('-');
                const task = (INITIAL_SCHEDULE[day] || []).find(t => t.id === taskId);
                if (task) xp += task.xp;
              }
            });
            return xp;
          }, [completedTasks]);

            let current = RANKS[0];
            for (let i = RANKS.length - 1; i >= 0; i--) {
              if (totalXp >= RANKS[i].minXp) {
                current = RANKS[i];
                break;
              }
            }
            return current;
          }, [totalXp]);

          const nextRank = useMemo(() => {
            const nextIdx = RANKS.findIndex(r => r.level === currentRank.level) + 1;
            return RANKS[nextIdx] || null;
          }, [currentRank]);

            if (!nextRank) return 100;
            const currentMin = currentRank.minXp;
            const nextMin = nextRank.minXp;
            const progress = ((totalXp - currentMin) / (nextMin - currentMin)) * 100;
            return Math.min(Math.max(progress, 0), 100);
          }, [totalXp, currentRank, nextRank]);

                  streak++;
                } else {
                  if (done === 0) return streak;
                  streak = 0;
                }
              }
            }

              ...prev,
              [key]: isNowChecked
            }));

                setTimeout(() => playSound('level'), 150);
              }
            } else {
              playSound('uncheck');
            }
          };

                                selectedWeek === w
                                  ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40'

                          const daySched = INITIAL_SCHEDULE[day] || [];
                          const doneCount = daySched.filter(t => completedTasks[`w${selectedWeek}-${day}-${t.id}`]).length;
                          const isComplete = daySched.length > 0 && doneCount === daySched.length;

                          return (
                            <button
                              key={day}

                              className={`py-2 px-1 rounded-xl text-center transition flex flex-col items-center justify-between border ${

                                    ? 'bg-emerald-950/40 text-emerald-300 border-emerald-800/60'
                                    : 'bg-neutral-950 text-neutral-400 border-neutral-800 hover:bg-neutral-800/50'

                            >
                              <span className="text-xs font-bold">{day.slice(0, 3)}</span>
                              <span className="text-[10px] mt-1 opacity-80">
                                {doneCount}/{daySched.length}

                      </div>

                      <div className="flex items-center space-x-4">

                        </div>

                        <button
                          onClick={resetCurrentDay}
                          className="p-2 text-neutral-500 hover:text-rose-400 hover:bg-neutral-800 rounded-xl transition"
                          title="Resetează bifările pentru această zi"
                        >
                          <RotateCcw className="w-4 h-4" />
                        </button>
                      </div>
                    </div>

                    <div className="space-y-2.5">
                      {currentDaySchedule.map((item) => {
                        const isChecked = !!completedTasks[`w${selectedWeek}-${selectedDay}-${item.id}`];

                        let catBadge = 'bg-neutral-800 text-neutral-400';
                        if (item.category === 'workout') {
                          catBadge = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                        } else if (item.category === 'code') {
                          catBadge = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20';
                        } else if (item.category === 'study') {
                          catBadge = 'bg-purple-500/10 text-purple-400 border-purple-500/20';
                        }

                        return (
                          <div
                            key={item.id}
                            onClick={() => toggleTask(item.id, item.xp)}
                            className={`group relative flex items-center justify-between p-3.5 sm:p-4 rounded-2xl border transition duration-200 cursor-pointer ${
                              isChecked
                                ? 'bg-emerald-950/20 border-emerald-500/40 shadow-sm'
                                : 'bg-neutral-900 border-neutral-800/80 hover:border-neutral-700 hover:bg-neutral-850'
                            }`}
                          >
                            <div className="flex items-center space-x-4">
                              <button 
                                className={`flex-shrink-0 w-6 h-6 rounded-lg border flex items-center justify-center transition ${
                                  isChecked 
                                    ? 'bg-emerald-500 border-emerald-400 text-neutral-950' 
                                    : 'border-neutral-700 bg-neutral-950 group-hover:border-neutral-500'
                                }`}
                              >
                                {isChecked ? <Check className="w-4 h-4 stroke-[3]" /> : null}
                              </button>

                              <div>
                                <div className="flex items-center space-x-2">
                                  <span className="text-xs font-mono text-neutral-400 font-semibold">{item.time}</span>
                                  <span className={`text-[10px] px-2 py-0.5 rounded-full border ${catBadge} uppercase font-bold tracking-wider`}>
                                    {item.category}
                                  </span>
                                </div>
                                <p className={`text-sm sm:text-base font-semibold mt-0.5 transition ${
                                  isChecked ? 'text-neutral-400 line-through' : 'text-neutral-100'
                                }`}>
                                  {item.task}
                                </p>
                              </div>
                            </div>

                            <div className={`flex items-center space-x-1 px-2.5 py-1 rounded-xl text-xs font-bold border ${
                              isChecked
                                ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'
                                : 'bg-neutral-950 text-amber-400 border-neutral-800'
                            }`}>
                              <Sparkles className="w-3 h-3" />
                              <span>+{item.xp} XP</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                  </div>
                )}

                {activeTab === 'progress' && (
                  <div className="space-y-6">

                    <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                      <div>
                        <h2 className="text-xl font-black text-white">Raport de Evoluție — Obiective 4 Săptămâni</h2>
                        <p className="text-xs text-neutral-400">Actualizează-ți valorile curente pentru a-ți urmări progresul în timp real.</p>
                      </div>
                      <div className="flex items-center space-x-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-xl text-emerald-400 text-xs font-bold">
                        <TrendingUp className="w-4 h-4" />
                        <span>Protocol Activ Luna Iadului</span>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      
                      <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-neutral-400 uppercase">Greutate Corporală</span>
                          <span className="text-xs font-bold text-rose-400">Target: 78 kg</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <div className="text-3xl font-black text-white">{userMetrics.weight} <span className="text-sm font-normal text-neutral-400">kg</span></div>
                          <div className="text-xs text-neutral-500">Pornire: 80 kg</div>
                        </div>
                        <div className="w-full bg-neutral-950 rounded-full h-2 overflow-hidden border border-neutral-800">
                          <div 
                            className="bg-rose-500 h-full transition-all duration-300" 
                            style={{ width: `${Math.min(100, Math.max(0, ((80 - userMetrics.weight) / 2) * 100))}%` }} 
                          />
                        </div>
                        <input 
                          type="number"
                          step="0.1"
                          value={userMetrics.weight}
                          onChange={(e) => setUserMetrics({...userMetrics, weight: parseFloat(e.target.value) || 0})}
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-1.5 text-xs text-neutral-200 focus:outline-none focus:border-emerald-500"
                          placeholder="Modifică valoarea"
                        />
                      </div>

                      <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-3">
                        <div className="flex items-center justify-between">

                          <span className="text-xs font-bold text-emerald-400">Target: 12 reps</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <div className="text-3xl font-black text-white">{userMetrics.pullups} <span className="text-sm font-normal text-neutral-400">reps</span></div>
                          <div className="text-xs text-neutral-500">Pornire: 6 reps</div>
                        </div>
                        <div className="w-full bg-neutral-950 rounded-full h-2 overflow-hidden border border-neutral-800">
                          <div 
                            className="bg-emerald-500 h-full transition-all duration-300" 
                            style={{ width: `${Math.min(100, (userMetrics.pullups / 12) * 100)}%` }} 
                          />
                        </div>
                        <input 
                          type="number"
                          value={userMetrics.pullups}
                          onChange={(e) => setUserMetrics({...userMetrics, pullups: parseInt(e.target.value) || 0})}
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-1.5 text-xs text-neutral-200 focus:outline-none focus:border-emerald-500"
                          placeholder="Modifică valoarea"
                        />
                      </div>

                      <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-neutral-400 uppercase">Flotări Max Reps</span>
                          <span className="text-xs font-bold text-cyan-400">Target: 30 reps</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <div className="text-3xl font-black text-white">{userMetrics.pushups} <span className="text-sm font-normal text-neutral-400">reps</span></div>
                          <div className="text-xs text-neutral-500">Pornire: 15 reps</div>
                        </div>
                        <div className="w-full bg-neutral-950 rounded-full h-2 overflow-hidden border border-neutral-800">
                          <div 
                            className="bg-cyan-400 h-full transition-all duration-300" 
                            style={{ width: `${Math.min(100, (userMetrics.pushups / 30) * 100)}%` }} 
                          />
                        </div>
                        <input 
                          type="number"
                          value={userMetrics.pushups}
                          onChange={(e) => setUserMetrics({...userMetrics, pushups: parseInt(e.target.value) || 0})}
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-1.5 text-xs text-neutral-200 focus:outline-none focus:border-emerald-500"
                          placeholder="Modifică valoarea"
                        />
                      </div>

                      <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-neutral-400 uppercase">Handstand Hold Liber</span>
                          <span className="text-xs font-bold text-amber-400">Target: 30 sec</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <div className="text-3xl font-black text-white">{userMetrics.handstandSec} <span className="text-sm font-normal text-neutral-400">sec</span></div>
                          <div className="text-xs text-neutral-500">Pornire: Wall reps</div>
                        </div>
                        <div className="w-full bg-neutral-950 rounded-full h-2 overflow-hidden border border-neutral-800">
                          <div 
                            className="bg-amber-400 h-full transition-all duration-300" 
                            style={{ width: `${Math.min(100, (userMetrics.handstandSec / 30) * 100)}%` }} 
                          />
                        </div>
                        <input 
                          type="number"
                          value={userMetrics.handstandSec}
                          onChange={(e) => setUserMetrics({...userMetrics, handstandSec: parseInt(e.target.value) || 0})}
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-1.5 text-xs text-neutral-200 focus:outline-none focus:border-emerald-500"
                          placeholder="Modifică secunde"
                        />
                      </div>

                      <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-neutral-400 uppercase">Ore Antrenament / Săpt.</span>
                          <span className="text-xs font-bold text-purple-400">Target: 15 ore</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <div className="text-3xl font-black text-white">{userMetrics.weeklyWorkoutHrs} <span className="text-sm font-normal text-neutral-400">ore</span></div>
                          <div className="text-xs text-neutral-500">Optimal: 15h</div>
                        </div>
                        <div className="w-full bg-neutral-950 rounded-full h-2 overflow-hidden border border-neutral-800">
                          <div 
                            className="bg-purple-400 h-full transition-all duration-300" 
                            style={{ width: `${Math.min(100, (userMetrics.weeklyWorkoutHrs / 15) * 100)}%` }} 
                          />
                        </div>
                        <input 
                          type="number"
                          value={userMetrics.weeklyWorkoutHrs}
                          onChange={(e) => setUserMetrics({...userMetrics, weeklyWorkoutHrs: parseInt(e.target.value) || 0})}
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-1.5 text-xs text-neutral-200 focus:outline-none focus:border-emerald-500"
                          placeholder="Modifică ore"
                        />
                      </div>

                      <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-neutral-400 uppercase">Venit Kwork Python</span>
                          <span className="text-xs font-bold text-emerald-400">Target: 200 €</span>
                        </div>
                        <div className="flex items-baseline justify-between">
                          <div className="text-3xl font-black text-white">{userMetrics.kworkEarning} <span className="text-sm font-normal text-neutral-400">€</span></div>
                          <div className="text-xs text-neutral-500">Freelancing</div>
                        </div>
                        <div className="w-full bg-neutral-950 rounded-full h-2 overflow-hidden border border-neutral-800">
                          <div 
                            className="bg-emerald-400 h-full transition-all duration-300" 
                            style={{ width: `${Math.min(100, (userMetrics.kworkEarning / 200) * 100)}%` }} 
                          />
                        </div>
                        <input 
                          type="number"
                          value={userMetrics.kworkEarning}
                          onChange={(e) => setUserMetrics({...userMetrics, kworkEarning: parseInt(e.target.value) || 0})}
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-1.5 text-xs text-neutral-200 focus:outline-none focus:border-emerald-500"
                          placeholder="Modifică venit (€)"
                        />
                      </div>

                    </div>

                  </div>
                )}

                {activeTab === 'rpg' && (
                  <div className="space-y-6">

                    <div className="bg-gradient-to-r from-neutral-900 via-neutral-900 to-neutral-950 border border-neutral-800 p-6 rounded-3xl relative overflow-hidden shadow-2xl">
                      <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-6 relative z-10">
                        
                        <div className="space-y-2">
                          <span className="text-xs font-bold text-amber-400 uppercase tracking-widest">Sistem de Rang RPG</span>
                          <h2 className={`text-4xl font-black tracking-tight ${currentRank.color}`}>
                            {currentRank.title} (Nivel {currentRank.level})
                          </h2>
                          <p className="text-xs text-neutral-400 max-w-lg">
                            Câștigă XP bifând orele de antrenament, prezența la CEITI și sesiunile de coding Python/Kwork.
                          </p>
                        </div>

                        <div className="bg-neutral-950/80 border border-neutral-800 p-4 rounded-2xl flex items-center space-x-6">
                          <div className="text-center">
                            <div className="text-xs text-neutral-400 font-medium">XP Total</div>
                            <div className="text-2xl font-black text-amber-400">{totalXp}</div>
                          </div>
                          <div className="h-8 w-[1px] bg-neutral-800" />
                          <div className="text-center">
                            <div className="text-xs text-neutral-400 font-medium">Următorul Rang</div>
                            <div className="text-sm font-bold text-neutral-200">{nextRank ? nextRank.title : 'MAX'}</div>
                          </div>
                        </div>

                      </div>
                    </div>

                    <div>
                      <h3 className="text-lg font-bold text-white mb-4 flex items-center space-x-2">
                        <Award className="w-5 h-5 text-amber-400" />
                        <span>Insigne & Realizări</span>
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {BADGES.map(b => {
                          let unlocked = false;
                          if (b.reqType === 'xp') unlocked = totalXp >= b.reqVal;
                          if (b.reqType === 'handstand') unlocked = userMetrics.handstandSec >= b.reqVal;
                          if (b.reqType === 'kwork') unlocked = userMetrics.kworkEarning >= b.reqVal;
                          if (b.reqType === 'workoutHours') unlocked = userMetrics.weeklyWorkoutHrs >= b.reqVal;
                          if (b.reqType === 'level') unlocked = currentRank.level >= b.reqVal;

                          return (
                            <div
                              key={b.id}
                              className={`p-4 rounded-2xl border transition flex items-start space-x-4 ${
                                unlocked
                                  ? 'bg-neutral-900 border-amber-500/30 text-neutral-100 shadow-md shadow-amber-500/5'
                                  : 'bg-neutral-950/60 border-neutral-800/60 text-neutral-500 opacity-60'
                              }`}
                            >
                              <div className={`p-3 rounded-xl border ${
                                unlocked 
                                  ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' 
                                  : 'bg-neutral-900 border-neutral-800 text-neutral-600'
                              }`}>
                                <Trophy className="w-6 h-6" />
                              </div>

                              <div className="space-y-1">
                                <div className="flex items-center space-x-2">
                                  <h4 className="text-sm font-bold text-white">{b.name}</h4>
                                  {unlocked && (
                                    <span className="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-bold border border-amber-500/30">
                                      DEBLOCAT
                                    </span>
                                  )}
                                </div>
                                <p className="text-xs text-neutral-400">{b.desc}</p>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                  </div>
                )}

              </main>

              <footer className="border-t border-neutral-800 mt-12 py-6 bg-neutral-950 text-center text-xs text-neutral-500">
                <p>Luna Iadului Protocol • 4 Săptămâni de Disciplină Absolută • Chișinău 2026</p>
              </footer>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
