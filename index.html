          { level: 6, title: 'Coders High', minXp: 5000, color: 'text-purple-400' },
          { level: 7, title: 'Gladiator', minXp: 7000, color: 'text-rose-400' },
          { level: 8, title: 'Maestru Iadului', minXp: 9500, color: 'text-orange-500' },
          { level: 9, title: 'Titan', minXp: 12500, color: 'text-yellow-400' },
          { level: 10, title: 'Invincibil', minXp: 16000, color: 'text-emerald-300 font-extrabold animate-pulse' }
        ];

        const BADGES = [
          { id: 'b1', name: 'Membru CEITI Disciplinat', desc: 'Ai completat toate cursurile și sesiunile.', reqType: 'xp', reqVal: 1000 },
          { id: 'b2', name: 'Handstand Master', desc: 'Atinge ținta de handstand liber (30s).', reqType: 'handstand', reqVal: 30 },
          { id: 'b3', name: 'Reel Fiend', desc: 'Postează reels constant după antrenamente.', reqType: 'xp', reqVal: 3000 },
          { id: 'b4', name: 'Kwork Earner', desc: 'Atinge pragul de 200€ din freelancing Python.', reqType: 'kwork', reqVal: 200 },
          { id: 'b5', name: '15 Ore Bifate', desc: 'Execută 15 ore de antrenament săptămânal.', reqType: 'workoutHours', reqVal: 15 },
          { id: 'b6', name: 'Fiară de Neoprit', desc: 'Atinge Nivelul 8 în Protocol.', reqType: 'level', reqVal: 8 }
        ];

        function App() {
          const [selectedWeek, setSelectedWeek] = useState(1);
          const [selectedDay, setSelectedDay] = useState('Luni');
          const [activeTab, setActiveTab] = useState('schedule');

          const [completedTasks, setCompletedTasks] = useState(() => {
            try {
              const saved = localStorage.getItem('luna_iadului_tasks');
              return saved ? JSON.parse(saved) : {};
            } catch (e) { return {}; }
          });

          const [userMetrics, setUserMetrics] = useState(() => {
            try {
              const saved = localStorage.getItem('luna_iadului_metrics');
              return saved ? JSON.parse(saved) : {
                weight: 80, pullups: 6, pushups: 15, handstandSec: 2, weeklyWorkoutHrs: 15, kworkEarning: 0
              };
            } catch (e) {
              return { weight: 80, pullups: 6, pushups: 15, handstandSec: 2, weeklyWorkoutHrs: 15, kworkEarning: 0 };
            }
          });

          useEffect(() => {
            localStorage.setItem('luna_iadului_tasks', JSON.stringify(completedTasks));
          }, [completedTasks]);

          useEffect(() => {
            localStorage.setItem('luna_iadului_metrics', JSON.stringify(userMetrics));
          }, [userMetrics]);

          const totalXp = useMemo(() => {
            let xp = 0;
            Object.keys(completedTasks).forEach(key => {
              if (completedTasks[key]) {
                const [w, day, taskId] = key.split('-');
                const task = (INITIAL_SCHEDULE[day] || []).find(t => t.id === taskId);
                if (task) xp += task.xp;
              }
            });
            return xp;
          }, [completedTasks]);

          const currentRank = useMemo(() => {
            let current = RANKS[0];
            for (let i = RANKS.length - 1; i >= 0; i--) {
              if (totalXp >= RANKS[i].minXp) { current = RANKS[i]; break; }
            }
            return current;
          }, [totalXp]);

          const nextRank = useMemo(() => {
            const nextIdx = RANKS.findIndex(r => r.level === currentRank.level) + 1;
            return RANKS[nextIdx] || null;
          }, [currentRank]);

          const xpProgressPercent = useMemo(() => {
            if (!nextRank) return 100;
            const progress = ((totalXp - currentRank.minXp) / (nextRank.minXp - currentRank.minXp)) * 100;
            return Math.min(Math.max(progress, 0), 100);
          }, [totalXp, currentRank, nextRank]);

          const currentDaySchedule = INITIAL_SCHEDULE[selectedDay] || [];
          const currentDayCompletedCount = currentDaySchedule.filter(
            t => completedTasks[`w${selectedWeek}-${selectedDay}-${t.id}`]
          ).length;
          const currentDayPercent = currentDaySchedule.length > 0 
            ? Math.round((currentDayCompletedCount / currentDaySchedule.length) * 100) : 0;

          const toggleTask = (taskId) => {
            const key = `w${selectedWeek}-${selectedDay}-${taskId}`;
            setCompletedTasks(prev => ({ ...prev, [key]: !prev[key] }));
          };

          const resetCurrentDay = () => {
            const updated = { ...completedTasks };
            currentDaySchedule.forEach(t => { delete updated[`w${selectedWeek}-${selectedDay}-${t.id}`]; });
            setCompletedTasks(updated);
          };

          return (
            <div className="max-w-4xl mx-auto p-4 sm:p-6 pb-24">
              
              {/* HEADER BAR */}
              <header className="border-b border-neutral-800 pb-4 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <div className="flex items-center space-x-3">
                  <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl text-emerald-400">
                    🔥
                  </div>
                  <div>
                    <h1 className="text-2xl font-black text-white uppercase tracking-wider">Luna Iadului</h1>
                    <p className="text-xs text-neutral-400">Protocol 24/7 • CEITI • Calisthenics • Python & Kwork</p>
                  </div>
                </div>

                <div className="bg-neutral-900 border border-neutral-800 px-4 py-2.5 rounded-2xl flex items-center space-x-4 shadow-lg">
                  <div>
                    <div className="text-[10px] text-neutral-400 font-medium">Nivel {currentRank.level}</div>
                    <div className={`text-sm font-bold ${currentRank.color}`}>{currentRank.title}</div>
                  </div>
                  <div className="h-6 w-[1px] bg-neutral-800" />
                  <div>
                    <div className="text-[10px] text-neutral-400 font-medium">XP Total</div>
                    <div className="text-sm font-bold text-amber-400">{totalXp} XP</div>
                  </div>
                </div>
              </header>

              {/* XP BAR */}
              <div className="mb-6 bg-neutral-900 p-3 rounded-2xl border border-neutral-800">
                <div className="flex justify-between text-xs mb-1.5 font-bold">
                  <span className="text-neutral-400">Progres Rang Curent</span>
                  <span className="text-emerald-400">{Math.round(xpProgressPercent)}%</span>
                </div>
                <div className="w-full bg-neutral-950 h-2.5 rounded-full overflow-hidden border border-neutral-800">
                  <div className="bg-gradient-to-r from-emerald-500 to-cyan-400 h-full transition-all duration-300" style={{ width: `${xpProgressPercent}%` }} />
                </div>
              </div>

              {/* NAVIGATION TABS */}
              <div className="flex gap-2 mb-6 border-b border-neutral-800 pb-3 overflow-x-auto">
                <button onClick={() => setActiveTab('schedule')} className={`px-5 py-2.5 rounded-xl font-bold text-xs transition ${activeTab === 'schedule' ? 'bg-emerald-500 text-neutral-950 shadow-lg shadow-emerald-500/20' : 'bg-neutral-900 text-neutral-400 hover:text-white'}`}>📅 Orar Zilnic & Detalii</button>
                <button onClick={() => setActiveTab('progress')} className={`px-5 py-2.5 rounded-xl font-bold text-xs transition ${activeTab === 'progress' ? 'bg-emerald-500 text-neutral-950 shadow-lg shadow-emerald-500/20' : 'bg-neutral-900 text-neutral-400 hover:text-white'}`}>📊 Raport Evoluție</button>
                <button onClick={() => setActiveTab('rpg')} className={`px-5 py-2.5 rounded-xl font-bold text-xs transition ${activeTab === 'rpg' ? 'bg-emerald-500 text-neutral-950 shadow-lg shadow-emerald-500/20' : 'bg-neutral-900 text-neutral-400 hover:text-white'}`}>🏆 Insigne & RPG</button>
              </div>

              {/* TAB 1: SCHEDULE */}
              {activeTab === 'schedule' && (
                <div className="space-y-4">
                  {/* WEEK SELECTOR */}
                  <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl space-y-3">
                    <div className="flex items-center justify-between border-b border-neutral-800 pb-2">
                      <span className="text-xs font-bold text-neutral-400 uppercase tracking-wider">Alege Săptămâna (Progresie Serii/Reps):</span>
                      <div className="flex gap-1.5">
                        {[1, 2, 3, 4].map(w => (
                          <button key={w} onClick={() => setSelectedWeek(w)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${selectedWeek === w ? 'bg-emerald-500 text-neutral-950' : 'bg-neutral-950 text-neutral-400 border border-neutral-800'}`}>Săpt. {w}</button>
                        ))}
                      </div>
                    </div>

                    {/* TARGETS FOR SELECTED WEEK */}
                    <div className="grid grid-cols-3 gap-2 text-center text-xs pt-1">
                      <div className="bg-neutral-950 p-2 rounded-xl border border-neutral-800">
                        <span className="block text-[10px] text-neutral-500">Tracțiuni S{selectedWeek}</span>
                        <span className="font-bold text-emerald-400">{WEEKLY_PROGRESSIONS[selectedWeek].pullups}</span>
                      </div>
                      <div className="bg-neutral-950 p-2 rounded-xl border border-neutral-800">
                        <span className="block text-[10px] text-neutral-500">Flotări S{selectedWeek}</span>
                        <span className="font-bold text-cyan-400">{WEEKLY_PROGRESSIONS[selectedWeek].pushups}</span>
                      </div>
                      <div className="bg-neutral-950 p-2 rounded-xl border border-neutral-800">
                        <span className="block text-[10px] text-neutral-500">Handstand S{selectedWeek}</span>
                        <span className="font-bold text-amber-400">{WEEKLY_PROGRESSIONS[selectedWeek].handstand}</span>
                      </div>
                    </div>
                  </div>

                  {/* DAY SELECTOR */}
                  <div className="grid grid-cols-7 gap-1">
                    {['Luni', 'Marti', 'Miercuri', 'Joi', 'Vineri', 'Sambata', 'Duminica'].map(day => (
                      <button key={day} onClick={() => setSelectedDay(day)} className={`py-2.5 text-center rounded-xl text-xs font-bold transition ${selectedDay === day ? 'bg-emerald-500 text-neutral-950 shadow-md' : 'bg-neutral-900 text-neutral-400 border border-neutral-800 hover:bg-neutral-800'}`}>{day.slice(0, 3)}</button>
                    ))}
                  </div>

                  {/* DAY HEADER & RESET */}
                  <div className="flex justify-between items-center bg-neutral-900 p-4 rounded-2xl border border-neutral-800">
                    <div>
                      <h2 className="font-bold text-white text-base">Program {selectedDay} (Săptămâna {selectedWeek})</h2>
                      <p className="text-xs text-neutral-400">Progres zi: <span className="text-emerald-400 font-bold">{currentDayPercent}%</span></p>
                    </div>
                    <button onClick={resetCurrentDay} className="text-xs text-neutral-500 hover:text-rose-400 bg-neutral-950 px-3 py-1.5 rounded-xl border border-neutral-800 transition">Resetează ziua</button>
                  </div>

                  {/* TASKS LIST WITH FULL DETAILS */}
                  <div className="space-y-2.5">
                    {currentDaySchedule.map(item => {
                      const isChecked = !!completedTasks[`w${selectedWeek}-${selectedDay}-${item.id}`];
                      const detailText = typeof item.detailW === 'function' ? item.detailW(selectedWeek) : item.detailW;

                      return (
                        <div key={item.id} onClick={() => toggleTask(item.id)} className={`p-4 rounded-2xl border transition cursor-pointer flex items-start justify-between gap-4 ${isChecked ? 'bg-emerald-950/20 border-emerald-500/40 text-neutral-400' : 'bg-neutral-900 border-neutral-800 text-neutral-100 hover:border-neutral-700'}`}>
                          <div className="flex items-start space-x-3 w-full">
                            <div className={`mt-0.5 w-6 h-6 rounded-lg border flex items-center justify-center flex-shrink-0 transition ${isChecked ? 'bg-emerald-500 border-emerald-400 text-neutral-950 font-bold' : 'border-neutral-700 bg-neutral-950'}`}>
                              {isChecked ? '✓' : ''}
                            </div>
                            <div className="w-full">
                              <span className="text-[10px] font-mono text-emerald-400 font-bold">{item.time}</span>
                              <div className={`text-sm font-semibold mt-0.5 ${isChecked ? 'line-through text-neutral-500' : 'text-white'}`}>{item.task}</div>
                              {detailText && (
                                <div className="text-xs text-neutral-300 mt-2 font-mono bg-neutral-950/80 p-3 rounded-xl border border-neutral-800 leading-relaxed whitespace-pre-line">
                                  {detailText}
                                </div>
                              )}
                            </div>
                          </div>
                          <span className={`text-xs px-2.5 py-1 rounded-xl font-bold flex-shrink-0 ${isChecked ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-neutral-950 text-amber-400 border border-neutral-800'}`}>
                            +{item.xp} XP
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* TAB 2: PROGRESS */}
              {activeTab === 'progress' && (
                <div className="space-y-4">
                  <div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl">
                    <h2 className="text-lg font-bold text-white mb-1">Raport Evoluție & Obiective</h2>
                    <p className="text-xs text-neutral-400">Introdu valorile curente pentru a urmări transformarea spre 78kg și 12 tracțiuni.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-neutral-950 p-4 rounded-2xl border border-neutral-800 space-y-2">
                      <div className="flex justify-between text-xs font-bold"><span className="text-neutral-400 uppercase">Greutate (Target: 78 kg)</span><span className="text-rose-400">80kg → 78kg</span></div>
                      <div className="text-3xl font-black">{userMetrics.weight} <span className="text-sm font-normal text-neutral-400">kg</span></div>
                      <input type="number" step="0.1" value={userMetrics.weight} onChange={e => setUserMetrics({...userMetrics, weight: parseFloat(e.target.value) || 0})} className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
                    </div>

                    <div className="bg-neutral-950 p-4 rounded-2xl border border-neutral-800 space-y-2">
                      <div className="flex justify-between text-xs font-bold"><span className="text-neutral-400 uppercase">Tracțiuni Max (Target: 12)</span><span className="text-emerald-400">6 → 12 reps</span></div>
                      <div className="text-3xl font-black">{userMetrics.pullups} <span className="text-sm font-normal text-neutral-400">reps</span></div>
                      <input type="number" value={userMetrics.pullups} onChange={e => setUserMetrics({...userMetrics, pullups: parseInt(e.target.value) || 0})} className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
                    </div>

                    <div className="bg-neutral-950 p-4 rounded-2xl border border-neutral-800 space-y-2">
                      <div className="flex justify-between text-xs font-bold"><span className="text-neutral-400 uppercase">Flotări Max (Target: 30)</span><span className="text-cyan-400">15 → 30 reps</span></div>
                      <div className="text-3xl font-black">{userMetrics.pushups} <span className="text-sm font-normal text-neutral-400">reps</span></div>
                      <input type="number" value={userMetrics.pushups} onChange={e => setUserMetrics({...userMetrics, pushups: parseInt(e.target.value) || 0})} className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
                    </div>

                    <div className="bg-neutral-950 p-4 rounded-2xl border border-neutral-800 space-y-2">
                      <div className="flex justify-between text-xs font-bold"><span className="text-neutral-400 uppercase">Handstand Hold (Target: 30s)</span><span className="text-amber-400">Liber 30s</span></div>
                      <div className="text-3xl font-black">{userMetrics.handstandSec} <span className="text-sm font-normal text-neutral-400">sec</span></div>
                      <input type="number" value={userMetrics.handstandSec} onChange={e => setUserMetrics({...userMetrics, handstandSec: parseInt(e.target.value) || 0})} className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
                    </div>

                    <div className="bg-neutral-950 p-4 rounded-2xl border border-neutral-800 space-y-2">
                      <div className="flex justify-between text-xs font-bold"><span className="text-neutral-400 uppercase">Venit Kwork (Target: 200 €)</span><span className="text-emerald-400">Freelancing Python</span></div>
                      <div className="text-3xl font-black">{userMetrics.kworkEarning} <span className="text-sm font-normal text-neutral-400">€</span></div>
                      <input type="number" value={userMetrics.kworkEarning} onChange={e => setUserMetrics({...userMetrics, kworkEarning: parseInt(e.target.value) || 0})} className="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500" />
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 3: RPG & BADGES */}
              {activeTab === 'rpg' && (
                <div className="space-y-4">
                  <div className="bg-gradient-to-r from-neutral-900 to-neutral-950 border border-neutral-800 p-6 rounded-3xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                    <div>
                      <span className="text-xs font-bold text-amber-400 uppercase tracking-widest">Sistem Rang RPG</span>
                      <h2 className={`text-3xl font-black ${currentRank.color}`}>{currentRank.title} (Nivel {currentRank.level})</h2>
                      <p className="text-xs text-neutral-400 mt-1">Acumulează XP prin bifarea activităților zilnice.</p>
                    </div>
                    <div className="bg-neutral-950 p-4 rounded-2xl border border-neutral-800 text-center">
                      <div className="text-[10px] text-neutral-400">XP Curent</div>
                      <div className="text-xl font-black text-amber-400">{totalXp} XP</div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {BADGES.map(b => {
                      let unlocked = false;
                      if (b.reqType === 'xp') unlocked = totalXp >= b.reqVal;
                      if (b.reqType === 'handstand') unlocked = userMetrics.handstandSec >= b.reqVal;
                      if (b.reqType === 'kwork') unlocked = userMetrics.kworkEarning >= b.reqVal;
                      if (b.reqType === 'workoutHours') unlocked = userMetrics.weeklyWorkoutHrs >= b.reqVal;
                      if (b.reqType === 'level') unlocked = currentRank.level >= b.reqVal;

                      return (
                        <div key={b.id} className={`p-4 rounded-2xl border transition flex items-start space-x-3 ${unlocked ? 'bg-neutral-900 border-amber-500/30 text-white' : 'bg-neutral-950/60 border-neutral-900 text-neutral-500 opacity-60'}`}>
                          <div className={`p-3 rounded-xl border ${unlocked ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' : 'bg-neutral-900 border-neutral-800 text-neutral-600'}`}>
                            🏆
                          </div>
                          <div>
                            <div className="flex items-center space-x-2">
                              <h4 className="text-sm font-bold">{b.name}</h4>
                              {unlocked && <span className="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-bold border border-amber-500/30">DEBLOCAT</span>}
                            </div>
                            <p className="text-xs text-neutral-400 mt-0.5">{b.desc}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
